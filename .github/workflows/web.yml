name: web
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    name: web build (emscripten)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
      - name: Install build tools
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends cmake xxd zip pkg-config
      - name: make web
        run: make web
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist/Breakup-*-web.zip
          if-no-files-found: error
